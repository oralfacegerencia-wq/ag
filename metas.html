<style>
  :root{--laranja:#f97316;--laranja-esc:#ea580c;--bg:#f7f7f8;--borda:#e5e7eb;--txt:#1f2937;--txt2:#6b7280;--verde:#16a34a;--vermelho:#dc2626}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px}
  input,select,textarea{font-family:inherit;font-size:13px}
  #telaLogin{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff7ed,#f7f7f8);z-index:200}
  .login-box{background:#fff;padding:34px 30px;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.08);width:340px}
  .login-box h1{font-size:19px;margin-bottom:4px}
  .login-box p{color:var(--txt2);font-size:13px;margin-bottom:20px}
  .campo{margin-bottom:12px}
  .campo label{display:block;font-size:11px;font-weight:700;color:var(--txt2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
  .campo input,.campo select,.campo textarea{width:100%;padding:9px 11px;border:1px solid var(--borda);border-radius:8px;outline:none;background:#fff}
  .campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--laranja);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
  .btn-laranja{width:100%;background:var(--laranja);color:#fff;padding:11px;border-radius:8px;font-weight:600}
  .btn-laranja:hover{background:var(--laranja-esc)}
  .erro{color:var(--vermelho);font-size:13px;margin-top:10px;min-height:18px}
  #app{display:none;flex-direction:column;min-height:100vh}
  header{background:#fff;border-bottom:1px solid var(--borda);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px}
  .badge-admin{font-size:10px;font-weight:800;letter-spacing:.06em;background:#111827;color:#fff;padding:4px 8px;border-radius:5px}
  .link-agenda{color:var(--laranja-esc);font-weight:600;font-size:12px;text-decoration:none;background:#fff7ed;border:1px solid #fed7aa;padding:7px 11px;border-radius:7px}
  .link-agenda:hover{background:#ffedd5}
  .user-info{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13px}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--laranja);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .btn-sair{color:var(--txt2);font-size:13px;padding:6px 10px;border-radius:6px}
  .btn-sair:hover{background:var(--bg)}
  .wrap{max-width:1280px;margin:0 auto;padding:16px;width:100%}
  .barra{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:12px 14px;display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .barra .campo{margin:0}
  .barra .campo select,.barra .campo input{padding:8px 10px;min-width:110px}
  .btn-cinza{padding:9px 14px;border:1px solid var(--borda);border-radius:8px;color:var(--txt);background:#fff}
  .btn-cinza:hover{background:var(--bg)}
  .btn-conf{padding:9px 16px;background:var(--laranja);color:#fff;border-radius:8px;font-weight:600}
  .btn-conf:hover{background:var(--laranja-esc)}
  .card{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:14px 16px}
  .kpi .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);margin-bottom:5px}
  .kpi .v{font-size:23px;font-weight:700}
  .kpi .s{font-size:11px;color:var(--txt2);margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:8px 9px;border-bottom:1px solid var(--borda);text-align:center}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--txt2);background:#fafafa;font-weight:700}
  th.ind,td.ind{text-align:left}
  td.metacol{background:#f9fafb;font-weight:700}
  tr.grupo td{background:#eff6ff;color:#1e40af;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:left}
  td .res{font-weight:700;font-size:13px}
  td .mta{font-size:10px;color:var(--txt2);font-weight:400}
  td.melhor{background:#dcfce7}
  td.pior{background:#fee2e2}
  td .pct{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:#fff7ed;color:var(--laranja-esc);border:1px solid #fed7aa}
  td .pct.ok{background:#dcfce7;color:#15803d;border-color:#bbf7d0}
  td .pct.ruim{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
  .legenda{display:flex;gap:14px;font-size:11px;color:var(--txt2);margin-bottom:9px;flex-wrap:wrap}
  .legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
  .vazio{color:#9ca3af;font-size:13px;padding:12px 2px}
  .aviso{font-size:11px;color:var(--laranja-esc);background:#fff7ed;border:1px solid #fed7aa;border-radius:7px;padding:7px 9px;margin-bottom:10px;display:none}
  .meta-fixa{background:#f9fafb;border:1px solid var(--borda);border-radius:8px;padding:9px 11px;font-size:13px;color:var(--txt);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .meta-fixa b{font-size:15px}
  .meta-fixa .rot{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
  .btn-meta-mini{font-size:11px;font-weight:700;color:var(--laranja-esc);background:#fff7ed;border:1px solid #fed7aa;border-radius:5px;padding:3px 7px;margin-left:5px}
  .btn-meta-mini:hover{background:#ffedd5}
  @media print{
    @page{size:A4 landscape;margin:8mm}
    body{background:#fff}
    header,.barra,#painelLancar,.no-print{display:none !important}
    .wrap{max-width:none;padding:0}
    .card{border:none;padding:0;margin-bottom:8px}
    .kpi{border:1px solid #ccc}
    th,td{font-size:8px;padding:3px 4px}
  }
</style>
</head>
<body>

<div id="telaLogin">
  <form class="login-box" id="formLogin">
    <h1>Metas e Resultados</h1>
    <p>Acesse com seu usuário e senha</p>
    <div class="campo"><label>Usuário</label><input id="inUsuario" autocomplete="username" required></div>
    <div class="campo"><label>Senha</label><input id="inSenha" type="password" autocomplete="current-password" required></div>
    <button class="btn-laranja" type="submit">Entrar</button>
    <div class="erro" id="erroLogin"></div>
  </form>
</div>

<div id="app">
  <header>
    <h1>Dashboard de Reunião</h1>
    <span class="badge-admin" id="badgeAdmin" style="display:none">ADMIN</span>
    <a class="link-agenda" href="index.html">Agenda</a>
    <div class="user-info">
      <div class="avatar" id="avatarUser">A</div>
      <span id="nomeUser">—</span>
      <button class="btn-sair" id="btnSair">Sair</button>
    </div>
  </header>

  <div class="wrap">
    <div class="barra">
      <div class="campo" id="boxSetor" style="display:none">
        <label>Setor</label>
        <select id="fSetor"><option value="">Todos</option></select>
      </div>
      <div class="campo" id="boxColab" style="display:none">
        <label>Colaborador</label>
        <select id="fColab"><option value="">Todos</option></select>
      </div>
      <div class="campo">
        <label>Mês</label>
        <select id="fMes"></select>
      </div>
      <div class="campo">
        <label>Ano</label>
        <select id="fAno"></select>
      </div>
      <div class="campo">
        <label>Semanas no mês</label>
        <select id="fSemanas">
          <option value="4">4 semanas</option>
          <option value="5">5 semanas</option>
        </select>
      </div>
      <button class="btn-conf" id="btnCarregar">Carregar</button>
      <button class="btn-cinza" id="btnAtualizar" title="Recarregar dados">Atualizar</button>
      <button class="btn-cinza" id="btnPdf" title="Imprimir ou salvar em PDF">PDF</button>
    </div>

    <div class="card" id="painelLancar">
      <h2 id="tituloLancar">Lançar resultado da semana</h2>
      <div class="aviso" id="avisoLancar"></div>
      <div class="grid">
        <div class="campo">
          <label>Colaborador</label>
          <select id="cProf"></select>
        </div>
        <div class="campo">
          <label>Indicador</label>
          <select id="cMetrica"></select>
        </div>
        <div class="campo" id="boxMeta" style="display:none">
          <label>Meta do mês do indicador</label>
          <input id="cMeta" type="number" step="0.01" min="0" placeholder="0">
        </div>
        <div class="campo" id="boxMetaFixa" style="display:none">
          <label>Meta do mês</label>
          <div class="meta-fixa">
            <span class="rot">Meta do indicador</span>
            <b id="metaFixaValor">—</b>
          </div>
        </div>
        <div class="campo">
          <label>Semana</label>
          <select id="cSemana">
            <option value="1">Semana 1</option>
            <option value="2">Semana 2</option>
            <option value="3">Semana 3</option>
            <option value="4">Semana 4</option>
            <option value="5">Semana 5</option>
          </select>
        </div>
        <div class="campo">
          <label>Resultado da semana</label>
          <input id="cResultado" type="number" step="0.01" min="0" placeholder="0">
        </div>
      </div>
      <div class="campo">
        <label>Observações</label>
        <textarea id="cObs" rows="2" placeholder="O que foi feito na semana"></textarea>
      </div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn-conf" id="btnSalvar">Salvar</button>
        <button class="btn-cinza" id="btnLimpar">Limpar</button>
        <button class="btn-cinza" id="btnNovaMetrica" style="display:none">+ Novo indicador</button>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="card">
      <h2 id="tituloTabela">Comparação semanal</h2>
      <div class="legenda">
        <span><i style="background:#dcfce7"></i>Melhor semana</span>
        <span><i style="background:#fee2e2"></i>Pior semana</span>
        <span>A meta do mês é dividida pela quantidade de semanas</span>
      </div>
      <div id="tabela"></div>
    </div>
  </div>
</div>

<script>
const CFG = window.AGENDA_CONFIG || {};
const db = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function num(n){
  const v = Number(n || 0);
  return v.toLocaleString('pt-BR', { minimumFractionDigits:0, maximumFractionDigits:2 });
}

let estado = {
  usuario: null,
  ehAdmin: false,
  profissionais: [],
  metricas: [],
  resultados: [],
  setor: '',
  colaborador: '',
  mes: new Date().getMonth() + 1,
  ano: new Date().getFullYear(),
  semanas: 4
};

function isoMes(){
  return estado.ano + '-' + pad(estado.mes) + '-01';
}
function nomeMes(){
  return MESES[estado.mes - 1] + '/' + estado.ano;
}

/* ================= SESSÃO ================= */
function salvarSessao(u){
  const txt = JSON.stringify(u);
  sessionStorage.setItem('agenda_user', txt);
  try { localStorage.setItem('agenda_user', txt); } catch(e){}
}
function lerSessao(){
  let txt = null;
  try { txt = sessionStorage.getItem('agenda_user'); } catch(e){}
  if (!txt){ try { txt = localStorage.getItem('agenda_user'); } catch(e){} }
  if (!txt) return null;
  try { return JSON.parse(txt); } catch(e){ return null; }
}
function limparSessao(){
  try { sessionStorage.removeItem('agenda_user'); } catch(e){}
  try { localStorage.removeItem('agenda_user'); } catch(e){}
}

/* ================= LOGIN ================= */
$('#formLogin').addEventListener('submit', async e => {
  e.preventDefault();
  const erro = $('#erroLogin');
  erro.textContent = '';
  const { data, error } = await db.rpc('login_usuario', {
    p_usuario: $('#inUsuario').value.trim(),
    p_senha: $('#inSenha').value
  });
  if (error){ erro.textContent = 'Erro ao conectar: ' + error.message; return; }
  if (!data || data.length === 0){ erro.textContent = 'Usuário ou senha inválidos.'; return; }
  estado.usuario = data[0];
  try {
    const { data: perfilData } = await db.from('usuarios').select('perfil').eq('id', data[0].id).single();
    if (perfilData && perfilData.perfil) estado.usuario.perfil = perfilData.perfil;
  } catch(e) {}
  estado.ehAdmin = (estado.usuario.perfil === 'admin');
  salvarSessao(estado.usuario);
  entrarNoApp();
});

$('#btnSair').addEventListener('click', () => {
  limparSessao();
  estado.usuario = null;
  estado.ehAdmin = false;
  $('#app').style.display = 'none';
  $('#telaLogin').style.display = 'flex';
  $('#inSenha').value = '';
});

function entrarNoApp(){
  $('#telaLogin').style.display = 'none';
  $('#app').style.display = 'flex';
  const nome = estado.usuario.nome || estado.usuario.usuario || '—';
  $('#nomeUser').textContent = nome;
  $('#avatarUser').textContent = nome.charAt(0).toUpperCase();

  if (estado.ehAdmin){
    $('#badgeAdmin').style.display = 'inline-block';
    $('#boxSetor').style.display = 'block';
    $('#boxColab').style.display = 'block';
    $('#btnNovaMetrica').style.display = 'inline-block';
    $('#boxMeta').style.display = 'block';
    $('#boxMetaFixa').style.display = 'none';
    $('#tituloLancar').textContent = 'Definir meta do indicador e lançar resultado';
  } else {
    $('#boxMeta').style.display = 'none';
    $('#boxMetaFixa').style.display = 'block';
    $('#tituloLancar').textContent = 'Lançar meu resultado da semana';
  }

  montarFiltrosAno();
  $('#fMes').innerHTML = MESES.map((m, i) => `<option value="${i+1}" ${i+1===estado.mes?'selected':''}>${m}</option>`).join('');
  $('#fSemanas').value = String(estado.semanas);
  carregarTudo();
}

function montarFiltrosAno(){
  const atual = new Date().getFullYear();
  let html = '';
  for (let a = atual - 2; a <= atual + 1; a++){
    html += `<option value="${a}" ${a===estado.ano?'selected':''}>${a}</option>`;
  }
  $('#fAno').innerHTML = html;
}

/* ================= CARREGAMENTO ================= */
async function carregarTudo(){
  try { await carregarProfissionais(); } catch(e){ console.error('profissionais', e); }
  try { await carregarMetricas(); } catch(e){ console.error('metricas', e); }
  try { await carregarResultados(); } catch(e){ console.error('resultados', e); }
  try { renderTudo(); } catch(e){ console.error('render', e); }
}

async function carregarProfissionais(){
  const { data, error } = await db.from('profissionais').select('*').eq('ativo', true).order('nome');
  if (error){ console.error(error); return; }
  const todos = data || [];
  if (estado.ehAdmin){
    estado.profissionais = todos;
  } else {
    const meu = norm(estado.usuario.nome);
    estado.profissionais = todos.filter(p => norm(p.nome) === meu);
    if (estado.profissionais.length === 0){
      const login = norm(estado.usuario.usuario);
      estado.profissionais = todos.filter(p => norm(p.nome) === login);
    }
  }
}

async function carregarMetricas(){
  const { data, error } = await db.from('metricas').select('*').eq('ativo', true).order('ordem');
  if (error){ console.error(error); return; }
  estado.metricas = data || [];
}

async function carregarResultados(){
  const { data, error } = await db.from('metas_resultados').select('*').eq('mes', isoMes());
  if (error){ console.error(error); return; }
  estado.resultados = data || [];
}

/* ================= SETORES E INDICADORES ================= */
function setoresDisponiveis(){
  const s = estado.profissionais.map(p => p.setor).filter(Boolean);
  estado.metricas.forEach(m => { if (m.setor) s.push(m.setor); });
  return [...new Set(s)].sort();
}

function metricasPorSetor(setor){
  if (!setor) return estado.metricas.slice();
  return estado.metricas.filter(m => String(m.setor || '') === setor);
}

function metricasVisiveis(){
  if (estado.ehAdmin) return metricasPorSetor(estado.setor);
  const meus = [...new Set(estado.profissionais.map(p => p.setor).filter(Boolean))];
  if (meus.length === 0) return estado.metricas.slice();
  return estado.metricas.filter(m => m.setor && meus.indexOf(m.setor) !== -1);
}

function setorDoColaborador(profId){
  const p = estado.profissionais.find(x => x.id === profId);
  return p ? String(p.setor || '') : '';
}

function metricasDoColaborador(profId){
  const setor = setorDoColaborador(profId);
  if (!setor) return metricasVisiveis();
  return metricasPorSetor(setor);
}

function colaboradoresDoEscopo(){
  if (estado.ehAdmin && estado.setor){
    return estado.profissionais.filter(p => p.setor === estado.setor);
  }
  return estado.profissionais;
}

/* ================= META E CÁLCULOS ================= */
function acharMetrica(metricaId){
  return estado.metricas.find(m => m.id === metricaId) || null;
}

function metaDoIndicador(metricaId){
  const m = acharMetrica(metricaId);
  return m ? Number(m.meta_mes || 0) : 0;
}

function profissionaisEscopo(){
  if (!estado.ehAdmin) return estado.profissionais;
  if (estado.colaborador){
    const p = estado.profissionais.find(x => x.id === estado.colaborador);
    return p ? [p] : [];
  }
  if (estado.setor) return estado.profissionais.filter(p => p.setor === estado.setor);
  return estado.profissionais;
}

function acharResultado(profId, metricaId, semana){
  return estado.resultados.find(r =>
    r.profissional_id === profId &&
    r.metrica_id === metricaId &&
    Number(r.semana) === Number(semana)
  ) || null;
}

function agregar(metricaId){
  const ids = profissionaisEscopo().map(p => p.id);
  const semanas = [];
  for (let s = 1; s <= 5; s++){
    let res = 0;
    estado.resultados.forEach(r => {
      if (r.metrica_id !== metricaId || Number(r.semana) !== s) return;
      if (ids.indexOf(r.profissional_id) === -1) return;
      res += Number(r.resultado || 0);
    });
    semanas.push({ res });
  }
  const totalRes = semanas.reduce((a, b) => a + b.res, 0);
  const meta = metaDoIndicador(metricaId);
  const divisor = estado.semanas > 0 ? estado.semanas : 1;
  const metaSemana = meta / divisor;
  const perc = meta > 0 ? Math.round((totalRes / meta) * 100) : null;
  return { semanas, totalRes, meta, metaSemana, perc };
}

/* ================= RENDER ================= */
function renderTudo(){
  const escopo = profissionaisEscopo();
  const nomeEscopo = estado.colaborador
    ? (escopo[0] ? escopo[0].nome : '—')
    : (estado.setor || (estado.ehAdmin ? 'Todos os setores' : (escopo[0] ? escopo[0].setor || 'Geral' : '—')));
  $('#tituloTabela').textContent = 'Dashboard de Reunião — ' + nomeEscopo + ' — ' + nomeMes();
  montarFiltrosSetor();
  montarFiltrosColab();
  renderSelectLancar();
  renderKpis();
  renderTabela();
}

function montarFiltrosSetor(){
  if (!estado.ehAdmin) return;
  const setores = setoresDisponiveis();
  $('#fSetor').innerHTML = '<option value="">Todos</option>' +
    setores.map(s => `<option value="${esc(s)}" ${s===estado.setor?'selected':''}>${esc(s)}</option>`).join('');
}

function montarFiltrosColab(){
  if (!estado.ehAdmin) return;
  const lista = estado.setor
    ? estado.profissionais.filter(p => p.setor === estado.setor)
    : estado.profissionais;
  $('#fColab').innerHTML = '<option value="">Todos</option>' +
    lista.map(p => `<option value="${p.id}" ${p.id===estado.colaborador?'selected':''}>${esc(p.nome)}</option>`).join('');
}

function renderSelectLancar(){
  const escopo = colaboradoresDoEscopo();
  const sel = $('#cProf');
  const antes = sel.value;
  sel.innerHTML = escopo.map(p => `<option value="${p.id}">${esc(p.nome)}${p.setor ? ' — ' + esc(p.setor) : ''}</option>`).join('');
  if (antes && escopo.some(p => p.id === antes)) sel.value = antes;
  sel.disabled = !estado.ehAdmin;

  const profAtual = sel.value;
  const aviso = $('#avisoLancar');
  if (escopo.length === 0){
    $('#cMetrica').innerHTML = '<option value="">Nenhum colaborador no setor</option>';
    aviso.style.display = 'block';
    aviso.textContent = 'Nenhum colaborador cadastrado neste setor.';
    return;
  }

  const visiveis = metricasDoColaborador(profAtual);
  const sm = $('#cMetrica');
  const ant = sm.value;
  if (visiveis.length === 0){
    sm.innerHTML = '<option value="">Nenhum indicador no setor</option>';
    aviso.style.display = 'block';
    const setorTxt = setorDoColaborador(profAtual) || 'deste colaborador';
    aviso.textContent = 'Nenhum indicador cadastrado para o setor ' + setorTxt + '. Peça ao admin para cadastrar.';
  } else {
    sm.innerHTML = visiveis.map(m => `<option value="${m.id}">${esc(m.grupo)} · ${esc(m.nome)}</option>`).join('');
    if (ant && visiveis.some(m => m.id === ant)) sm.value = ant;
    aviso.style.display = 'none';
  }
  atualizarCampos();
}

function atualizarCampos(){
  const profId = $('#cProf').value;
  const metricaId = $('#cMetrica').value;
  if (!profId || !metricaId) return;

  const meta = metaDoIndicador(metricaId);
  if (estado.ehAdmin){
    $('#cMeta').value = meta ? meta : '';
  } else {
    $('#metaFixaValor').textContent = meta ? num(meta) : 'não definida';
  }

  const semana = Number($('#cSemana').value);
  const r = acharResultado(profId, metricaId, semana);
  $('#cResultado').value = r && r.resultado !== null && r.resultado !== undefined ? r.resultado : '';
  $('#cObs').value = r ? (r.observacoes || '') : '';
}

function renderKpis(){
  const visiveis = metricasVisiveis();
  let tm = 0, tr = 0;
  visiveis.forEach(m => {
    const a = agregar(m.id);
    tm += a.meta;
    tr += a.totalRes;
  });
  const perc = tm > 0 ? Math.round((tr / tm) * 100) : 0;
  const escopo = profissionaisEscopo();
  const metaSemanaTotal = estado.semanas > 0 ? tm / estado.semanas : 0;
  $('#kpis').innerHTML = `
    <div class="kpi"><div class="l">Meta do mês</div><div class="v">${num(tm)}</div><div class="s">${visiveis.length} indicador(es)</div></div>
    <div class="kpi"><div class="l">Meta por semana</div><div class="v">${num(metaSemanaTotal)}</div><div class="s">meta ÷ ${estado.semanas} semanas</div></div>
    <div class="kpi"><div class="l">Resultado acumulado</div><div class="v">${num(tr)}</div><div class="s">soma das semanas</div></div>
    <div class="kpi"><div class="l">Atingimento</div><div class="v">${perc}%</div><div class="s">resultado ÷ meta do mês</div></div>
  `;
}

function renderTabela(){
  const box = $('#tabela');
  const visiveis = metricasVisiveis();
  if (visiveis.length === 0){
    box.innerHTML = '<div class="vazio">Nenhum indicador cadastrado para ' + (estado.setor ? 'o setor ' + esc(estado.setor) : 'o escopo atual') + '.</div>';
    return;
  }
  const grupos = {};
  const ordemGrupos = [];
  visiveis.forEach(m => {
    const g = m.grupo || 'Geral';
    if (!grupos[g]){ grupos[g] = []; ordemGrupos.push(g); }
    grupos[g].push(m);
  });

  let html = '<table><thead><tr><th class="ind">Indicador</th><th>Meta / mês</th>';
  for (let s = 1; s <= 5; s++) html += `<th>Semana ${s}</th>`;
  html += '<th>Total</th><th>%</th></tr></thead><tbody>';

  ordemGrupos.forEach(g => {
    html += `<tr class="grupo"><td colspan="9">📁 ${esc(g)}</td></tr>`;
    grupos[g].forEach(m => {
      const a = agregar(m.id);
      const vals = a.semanas.map(x => x.res);
      const comValor = vals.filter(v => v > 0);
      let idxMelhor = -1, idxPior = -1;
      if (comValor.length > 1){
        const max = Math.max.apply(null, vals);
        const min = Math.min.apply(null, comValor);
        if (max !== min){
          idxMelhor = vals.indexOf(max);
          idxPior = vals.indexOf(min);
        }
      }
      html += `<tr><td class="ind"><b>${esc(m.nome)}</b> <span class="mta">(${esc(m.unidade || 'qtd')})</span></td>`;
      const botao = estado.ehAdmin
        ? `<button class="btn-meta-mini" data-meta="${m.id}" title="Editar meta do indicador">editar</button>`
        : '';
      html += `<td class="metacol">` + (a.meta ? num(a.meta) : '—') +
        `<div class="mta">semana: ${a.meta ? num(a.metaSemana) : '—'}</div>` + botao + '</td>';
      a.semanas.forEach((x, i) => {
        const cls = i === idxMelhor ? 'melhor' : (i === idxPior ? 'pior' : '');
        html += `<td class="${cls}">` + (x.res > 0
          ? `<div class="res">${num(x.res)}</div>`
          : '<span class="mta">—</span>') + '</td>';
      });
      const clsP = a.perc === null ? '' : (a.perc >= 100 ? 'ok' : 'ruim');
      html += `<td><div class="res">${num(a.totalRes)}</div></td>`;
      html += `<td>${a.perc !== null ? `<span class="pct ${clsP}">${a.perc}%</span>` : '<span class="mta">—</span>'}</td>`;
      html += '</tr>';
    });
  });

  html += '</tbody></table>';
  box.innerHTML = html;

  box.querySelectorAll('[data-meta]').forEach(b => {
    b.onclick = () => editarMetaIndicador(b.dataset.meta);
  });
}

/* ================= AÇÕES ================= */
async function salvarMetaIndicador(metricaId, valor){
  const m = acharMetrica(metricaId);
  if (!m) return false;
  const { error } = await db.from('metricas')
    .update({ meta_mes: valor })
    .eq('id', metricaId);
  if (error){ alert('Erro ao salvar meta: ' + error.message); return false; }
  m.meta_mes = valor;
  return true;
}

async function editarMetaIndicador(metricaId){
  const m = acharMetrica(metricaId);
  if (!m) return;
  const atual = Number(m.meta_mes || 0);
  const txt = prompt('Meta do mês para "' + m.nome + '" (setor ' + (m.setor || '—') + '):', atual || '');
  if (txt === null) return;
  const valor = Number(String(txt).replace(',', '.'));
  if (isNaN(valor) || valor < 0){ alert('Valor inválido.'); return; }
  const ok = await salvarMetaIndicador(metricaId, valor);
  if (!ok) return;
  renderTudo();
  atualizarCampos();
}

$('#btnSalvar').onclick = async () => {
  const profId = $('#cProf').value;
  const metricaId = $('#cMetrica').value;
  if (!profId){ alert('Selecione o colaborador.'); return; }
  if (!metricaId){ alert('Selecione o indicador.'); return; }

  const semana = Number($('#cSemana').value);
  const resultado = Number($('#cResultado').value || 0);
  const quem = estado.usuario.nome || estado.usuario.usuario;
  const agora = new Date().toISOString();

  if (estado.ehAdmin){
    const meta = Number($('#cMeta').value || 0);
    const ok = await salvarMetaIndicador(metricaId, meta);
    if (!ok) return;
  }

  const { error } = await db.from('metas_resultados').upsert({
    profissional_id: profId,
    metrica_id: metricaId,
    mes: isoMes(),
    semana,
    meta: 0,
    resultado,
    observacoes: $('#cObs').value.trim() || null,
    alterado_por: quem,
    alterado_em: agora,
    criado_por: quem,
    criado_em: agora
  }, { onConflict: 'profissional_id,metrica_id,mes,semana' });

  if (error){ alert('Erro ao salvar resultado: ' + error.message); return; }
  await carregarMetricas();
  await carregarResultados();
  renderTudo();
  atualizarCampos();
  alert('Salvo com sucesso.');
};

$('#btnLimpar').onclick = () => {
  $('#cResultado').value = '';
  $('#cObs').value = '';
};

$('#btnNovaMetrica').onclick = async () => {
  const setores = setoresDisponiveis();
  const sugestao = estado.setor || (setores[0] || '');
  const nome = prompt('Nome do indicador (ex.: Leads por Indicações):');
  if (!nome) return;
  const grupo = prompt('Grupo do indicador (ex.: Atendimento & Indicações):') || 'Geral';
  const setor = prompt(
    'Setor do indicador. Obrigatório — só aparece para este setor.\n\n' +
    (setores.length ? 'Setores existentes:\n' + setores.map((s, i) => (i+1) + '. ' + s).join('\n') + '\n\n' : '') +
    'Digite o nome do setor:',
    sugestao
  );
  if (!setor || !setor.trim()){ alert('O setor é obrigatório para vincular o indicador.'); return; }
  const metaTxt = prompt('Meta do mês para este indicador:', '0');
  if (metaTxt === null) return;
  const metaValor = Number(String(metaTxt || '0').replace(',', '.'));
  if (isNaN(metaValor) || metaValor < 0){ alert('Meta inválida.'); return; }

  const { error } = await db.from('metricas').insert({
    nome: nome.trim(),
    grupo: grupo.trim(),
    setor: setor.trim(),
    unidade: 'qtd',
    meta_mes: metaValor,
    ordem: (estado.metricas.length + 1),
    criado_por: estado.usuario.nome || estado.usuario.usuario
  });
  if (error){ alert('Erro ao criar indicador: ' + error.message); return; }
  await carregarMetricas();
  renderTudo();
  alert('Indicador criado para o setor ' + setor.trim() + '.');
};

$('#cProf').onchange = () => { renderSelectLancar(); };
$('#cMetrica').onchange = () => { atualizarCampos(); };
$('#cSemana').onchange = () => { atualizarCampos(); };

$('#fSetor').onchange = e => {
  estado.setor = e.target.value;
  estado.colaborador = '';
  renderTudo();
};
$('#fColab').onchange = e => {
  estado.colaborador = e.target.value;
  renderTudo();
};
$('#fSemanas').onchange = e => {
  estado.semanas = Number(e.target.value) || 4;
  renderTudo();
};
$('#btnCarregar').onclick = async () => {
  estado.mes = Number($('#fMes').value);
  estado.ano = Number($('#fAno').value);
  estado.semanas = Number($('#fSemanas').value) || 4;
  await carregarTudo();
};
$('#btnAtualizar').onclick = () => carregarTudo();
$('#btnPdf').onclick = () => window.print();

(function init(){
  const salvo = lerSessao();
  if (salvo){
    estado.usuario = salvo;
    estado.ehAdmin = (estado.usuario.perfil === 'admin');
    entrarNoApp();
    return;
  }
  $('#telaLogin').style.display = 'flex';
})();
</script>
